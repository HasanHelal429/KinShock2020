# poc1d_twin -- 1D twin of the collaborator's 2D PoC_2d_v2 (FLASH OmegaShock_07-10 surrogate).
#
# SAME PHYSICS AND NUMERICS AS PoC_2d_v2, ONE DIMENSION. Every primary below is the 2D
# deck's value; what differs, and why:
#   1. dims 2 -> 1 (z only). The 2D heater spot (radius 1.35 d_i0) becomes a transversely
#      uniform foil -- which is the geometry PoC_2d_calib measured v_p = 0.1088c and the
#      ~2.4x heater overshoot on, so this twin re-measures that calibration.
#   2. dt is matched, not the CFL: the 2D CFL 0.5 gives dt = 0.5 dz/(c sqrt 2), and this
#      repo's dt = cfl dz/c, so cfl = 0.5/sqrt(2) = 0.35355 -> dt = 0.13004/w_pe in both.
#   3. ppc 36 / 16 per cell -> 1024: 1D is cheap (6.9 M particles), and the comparison
#      should be dimensionality, not noise.
#   4. B0(z): B0/(1+z/L), L = 1.37 d_i0 as FLASH, but FLOORED at 1 T (B0/8) -- the field
#      decays 8 T -> 1 T (at z = 7 L = 9.6 d_i0) and stays 1 T beyond. Applied to the
#      PARTICLES (units.field_profile): in 1D a decaying Bx(z) has curl B != 0, and on the
#      grid it would need a plasma current the ambient does not carry. The 2D deck's own
#      treatment of the gradient is unknown here -- confirm before comparing B profiles.
#   5. theta_i_init 1e-5 m_e c^2 is written ion-normalized (repo convention): 1e-7.
#
# UNITS. n0 = 1e18 m^-3 is free; B0 = 3.2553 mT is the value at which v_A/c = 0.0169826
# (the 2D vA_over_c) with ions at n_e/Z -- i.e. the 8 T of FLASH. FLASH-equivalent map:
# 1/w_ci0 = 2.42 ns, d_i0 = 313 um, v_A = 129 km/s (see the shock workbook column).
#
# BETA CONVENTION. This repo's beta is mu0 n kT/B^2 (no 2, Table I's convention): the
# FLASH electron beta 0.2440 (2 mu0 n kT/B^2) is 0.1220 here.

meta:
  run_id: poc1d_twin
  tier: Pilot
  description: >
    1D twin of PoC_2d_v2 (FLASH OmegaShock_07-10 surrogate): CH ion Z=3.5, m_i=100 m_e,
    n_t:n_amb = 400, B decaying 8 T -> 1 T (floored), drive off at 2.1 ns, to 7.05 ns;
    same dz/dt/shape/filter as the 2D run, 1024 ppc.
  reference: "Collaborator's PoC_2d_v2 config; FLASH cellar/data/OmegaShock_07-10"
  deck: inputs_kinshock_poc1d_twin

reference:
  n0: 1.0e18                  # [m^-3] n_e reference (free choice)
  mass_ratio: 100.0           # [-] m_i/m_e for the WHOLE CH ion (A = 6.5)
  charge_state: 3.5           # [-] effective CH ion Z (FLASH ms_chamZ)

plasma:
  piston:
    density_over_n0: 5.0      # n_t = 5 n0 -> n_t:n_amb = 400
    theta_e_heat: 0.037       # heater setpoint (2D: achieved ~2.4x)
    theta_e_init: 0.001
    theta_i_init: 1.0e-7      # 1e-5 m_e c^2 / mass_ratio (ion-normalized)
  ambient:
    density_over_n0: 0.0125   # d_i0/d_e = 47.8
    theta_0: 0.00100559       # beta_e 0.2441 / beta_tot 0.3138 in the 2 mu0 convention

field:
  orientation: perpendicular
  B0_tesla: 3.2553320750e-3   # = 8 T FLASH-equivalent (v_A/c = 0.0169826 at the foil)
  profile:
    type: inverse_linear      # B_x(z) = max(B0/(1+z/L), floor)
    decay_length_di0: 1.37    # FLASH: B halves at 429 um = 1.37 d_i0
    floor_over_B0: 0.125      # 1 T / 8 T
    apply: particle

geometry:
  dims: 1
  normal_axis: z
  slab_halfwidth_di: 2.0      # 2 d_i(n0) = 10.69 d_e, as the 2D piston
  domain_halfwidth_de: 1235.862   # [0, 1235.9 d_e] = 25.85 d_i0, as 2D
  dz_over_de: 0.3678161       # as 2D -> n_cell 3360
  layout: one_sided
  boundary:
    lo: reflecting            # as 2D (specular foil wall)
    hi: open                  # pec fields + absorbing particles, as 2D

numerics:
  cfl: 0.35355339             # = 0.5/sqrt(2): matches the 2D dt (0.13004/w_pe)
  particle_shape: 2
  filter_npass: 1
  max_step: 63000             # t*w_ci0 = 2.910 = 7.05 ns, as 2D
  max_grid_size: 3360         # one box, one GPU
  ppc:
    piston: 1024
    ambient: 1024

operators:
  stop_t_wci0: 0.8728         # drive off at 2.1 ns (FLASH laser), as 2D -> step 18894
  heater:
    species: piston_electrons
    intervals: 20
  injector:
    species: piston_electrons
    neutralizing_species: piston_ions
    intervals: 20
    tau_over_wpe_inv: 40.0

species:
  piston_electrons: {kind: electron, role: piston}
  piston_ions:      {kind: ion, role: piston, charge_state: 3.5}
  amb_electrons:    {kind: electron, role: ambient}
  amb_ions:         {kind: ion, role: ambient, charge_state: 3.5}
ion_species:     [piston_ions, amb_ions]
ambient_ion_species: [amb_ions]

targets:
  M_A: 6.4                    # at B0 (the foil); local M_A rises 8x where B = 1 T
  M_ms: 6.0
  beta_0: 0.1220              # FLASH beta_e 0.2440 in this repo's (no-2) convention

diagnostics:
  plotfile_intervals: 6300    # 10 raw-particle frames
  field_intervals: 630        # 100 field frames
  reduced_intervals: 300      # 210 rows
  checkpoint_intervals: 21000 # needed by submit_chain; 3 checkpoints
  phase_space:
    intervals: 126            # 500 frames, as the 2D strip cadence
    z_bin_de: 1.0             # 1236 z bins
    u_bins: 256

model:
  vsh_over_Csab: 3.02201      # v_sh := v_p, so M_A is the piston Alfven Mach (as 2D)
  vp_over_c: 0.108756         # PoC_2d_calib measured piston speed
