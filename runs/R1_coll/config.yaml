# R1_coll — R1_warm + Coulomb collisions at an absolute ambient density of 1e18 cm^-3.
#
# The COLLISIONAL twin of runs/R1_warm (the plan's R6 slot, REPLICATION_PLAN §4).
# Every dimensionless primary is byte-identical to R1_warm — mass_ratio, the density
# contrast 2.5 : 1 : 0.01, theta_e_heat = 0.078, theta_i_init, theta_0, vA/c, the domain
# in d_e, dz/d_e, cfl, ppc, max_step, all diagnostics. Only two things change:
#
#   1. reference.n0 : 1.0e18 -> 1.0e26 m^-3, i.e. n_e,ab = 1e20 cm^-3 so the AMBIENT
#      n_e0 = 0.01 n_e,ab = 1e18 cm^-3, an HED-relevant absolute density (the paper's
#      Table I realization is 4.8e18 cm^-3).
#   2. the `collisions` block below.
#
# n0 is a pure scale factor in the collisionless problem (REPLICATION_PLAN §1: real c,
# free n0), so change (1) alone leaves every normalized PIC quantity untouched —
# dt*wpe = 0.225, n_cell = 25000, M_A, M_ms, beta_ab, beta_0 are all exactly R1_warm's.
# It only fixes the absolute scales the collision operator needs:
#     d_e,ab = 0.531 um   d_i0 = 53.1 um   B0 = 32.1 T   dt = 0.399 fs   tau_sim = 99.7 ps
#
# WHY lnLambda IS FORCED (the honest caveat, cf. the R1_warm header).
# We reproduce the paper at the REAL speed of light, so theta_e_heat = 0.078 means
# T_e,ab = 39.9 keV, not the paper's ~470 eV. Since nu_ei ~ n T^-3/2, the plasma is
# collisionless by a huge margin at ANY attainable density: at n_e,ab = 1e20 cm^-3 the
# physical (NRL) lnLambda = 11.6 gives mfp_ei,ab = 3.7e5 d_e,ab. Reaching mfp = 20 d_e,ab
# with a physical lnLambda would need n_e,ab ~ 3e28 cm^-3 — far above solid density.
# So collisionality is dialled in through lnLambda, which nu_ei is exactly linear in:
# `collisions.target` states the PHYSICS target and kinshock.units inverts it to the
# lnLambda written into the deck. That is the whole point of this run — a collisional
# comparison at a realistic density is only reachable with lnLambda as a knob.
#
# CAUTION — TWO DIFFERENT "20"s. The target below is the PAPER's collisionality,
# lambda_ab = omega_ce,ab/nu_ei,ab = 20 (Table I). That is mfp/rho_e,ab, NOT mfp/d_e,ab:
# with rho_e,ab = 27.9 d_e,ab it means an electron mean free path of 559 d_e,ab = 5.6 d_i0,
# so the plasma stays collisionless at ion scales, as in the paper (lambda_mfp/d_i0 = 350)
# — which is the premise of its Fig. 13 result that collisional and collisionless shock
# formation look the same. Do not confuse it with `quantity: mfp_over_de, value: 20`, which
# is a DIFFERENT and ~28x more collisional run (mfp = 0.2 d_i0, collisional across the ramp).

meta:
  run_id: R1_coll
  tier: Full
  description: >
    Collisional twin of R1_warm: identical dimensionless setup (M_A~14 perpendicular,
    warm ablative piston ions) pinned to an absolute ambient density n_e0 = 1e18 cm^-3,
    with pairwise Coulomb collisions on all species pairs tuned to the paper's Table I
    collisionality lambda_ab = omega_ce,ab/nu_ei,ab = 20 (mfp = 559 d_e,ab = 5.6 d_i0).
  reference: "Schaeffer et al., Phys. Plasmas 27, 042901 (2020), Table I + Fig. 13"
  deck: inputs_kinshock_R1_coll

reference:
  n0: 1.0e26                  # m^-3 = 1e20 cm^-3 ablation ref -> ambient n_e0 = 1e18 cm^-3
  mass_ratio: 100.0
  charge_state: 1

plasma:
  piston:
    density_over_n0: 2.5
    theta_e_heat: 0.078       # identical to R1_warm (settled M_A ~ 14)
    theta_e_init: 0.001
    theta_i_init: 7.8e-4      # = theta_e_heat/mass_ratio -> T_i = T_e,ab -> v_th,i = C_s,ab
  ambient:
    density_over_n0: 0.01
    theta_0: 0.002

field:
  orientation: perpendicular
  vA_over_c: 0.01

geometry:
  dims: 1
  normal_axis: z
  slab_halfwidth_di: 2.0
  domain_halfwidth_de: 7500.0
  dz_over_de: 0.3
  layout: one_sided
  boundary:
    lo: symmetry
    hi: open

numerics:
  cfl: 0.75
  particle_shape: 2
  max_step: 250000
  ppc:
    piston: 100
    ambient: 100

operators:
  heater:
    species: piston_electrons
    intervals: 20
  injector:
    species: piston_electrons
    neutralizing_species: piston_ions
    intervals: 20
    tau_over_wpe_inv: 40.0

# Coulomb collisions — WarpX `pairwisecoulomb` (relativistic binary Monte Carlo,
# Perez et al. 2012), the equivalent of the paper's Takizuka-Abe operator.
#   pairs: all -> every unordered species pair INCLUDING the intra-species self-pairs
#          (e-e, i-i, e-i within and across the piston/ambient populations), so the
#          treatment does not depend on which population a physical electron is in.
#   target -> kinshock.units solves for the lnLambda the deck uses:
#          lambda_ab   : the paper's omega_ce,ab/nu_ei,ab          <-- used here (Table I: 20)
#          mfp_over_de : v_te,ab/nu_ei,ab in ablation skin depths
#          coulomb_log : set lnLambda directly ('physical' = NRL formula)
# Resulting rate: lnLambda = 7713, nu_ei,ab = 2.82e11 s^-1, nu_ei*dt = 1.1e-4, so the
# collision time is resolved ~9000x by the PIC step and no subcycling is needed.
collisions:
  model: pairwisecoulomb
  pairs: all
  target:
    quantity: lambda_ab
    value: 20.0
  ndt_supercycle: 1

diagnostics:
  plotfile_intervals: 5000
  reduced_intervals: 500
  field_intervals: 250

species:
  piston_electrons: {kind: electron, role: piston}
  piston_ions:      {kind: ion, role: piston, charge_state: 1}
  amb_electrons:    {kind: electron, role: ambient}
  amb_ions:         {kind: ion, role: ambient, charge_state: 1}
ion_species:     [piston_ions, amb_ions]
ambient_ion_species: [amb_ions]

model:
  vsh_over_Csab: 4.6
  vp_over_c: 0.104

targets:
  M_A: 14
  M_ms: 13
  beta_ab: 1150
  beta_0: 0.2
