# R1_core_half — one-sided (half-domain) version of R1_core. IDENTICAL physics
# primaries to runs/R1_core/config.yaml, but exploits the z -> -z symmetry: the
# +z half [0, 3600 d_e] with a reflecting (symmetry/foil) wall at z=0 instead of
# the symmetric domain [-3600, +3600] running two counter-propagating shocks.
# Half the cells (12000 vs 24000) and particles for the same z>=0 physics.
#
# Purpose: cross-check the half-domain shock (front trajectory, ~4x compression,
# reflected-ambient-ion fraction) against the completed full-domain R1_core
# (runs/R1_core/) on z>=0, confirming the localized near-wall artifact seen at R0
# (piston B_perp ~15-20% high, buried in the foil) does NOT reach the shock at
# physics resolution (dz=0.3 d_e). See RESULTS.md 2026-07-23.

meta:
  run_id: R1_core_half
  tier: Core
  description: >
    One-sided R1_core: full R1 physics on the +z half [0, 3600 d_e] (12000 cells,
    125000 steps ~ 2.8 wci0^-1) with a reflecting wall at z=0. Cross-check vs the
    symmetric full-domain R1_core on z>=0.
  reference: "Schaeffer et al., Phys. Plasmas 27, 042901 (2020), Table I"
  deck: inputs_kinshock_R1_core_half
  warpx_build: "warpx-cda/build/bin/warpx.1d (prebuilt, heater+injector modules)"
  generated_from: "Authored from R1_core with a one-sided half-domain (wall at z=0)."

reference:
  n0: 1.0e18
  mass_ratio: 100.0
  charge_state: 1

plasma:
  piston:
    density_over_n0: 2.5
    theta_e_heat: 0.092
    theta_e_init: 0.001
    theta_i_init: 1.0e-5
  ambient:
    density_over_n0: 0.01
    theta_0: 0.002

field:
  orientation: perpendicular
  vA_over_c: 0.01

geometry:
  dims: 1
  normal_axis: z
  slab_halfwidth_di: 2.0
  domain_halfwidth_de: 3600.0    # +z extent; one-sided domain is [0, 3600 d_e]
  dz_over_de: 0.3                # Table I resolution
  layout: one_sided             # [0, half] instead of symmetric [-half, +half]
  boundary:
    lo: reflecting               # z=0: symmetry / foil wall (pec fields + specular particles)
    hi: open                     # far upstream: absorbing particles + pec fields (div-cleaner-safe with B0)

numerics:
  cfl: 0.75
  particle_shape: 2
  max_step: 125000               # ~2.8 wci0^-1 (covers t*_1 ~1, t*_2 ~2.5)
  ppc:
    piston: 100
    ambient: 100

operators:
  heater:
    species: piston_electrons
    intervals: 20
  injector:
    species: piston_electrons
    neutralizing_species: piston_ions
    intervals: 20
    tau_over_wpe_inv: 40.0

diagnostics:
  plotfile_intervals: 2500       # Full plotfiles (fields + raw particles) -> ~50 frames
  reduced_intervals: 500         # EP/PN reduced diags (energy balance, particle count)

species:
  piston_electrons: {kind: electron, role: piston}
  piston_ions:      {kind: ion, role: piston, charge_state: 1}
  amb_electrons:    {kind: electron, role: ambient}
  amb_ions:         {kind: ion, role: ambient, charge_state: 1}
ion_species:     [piston_ions, amb_ions]
ambient_ion_species: [amb_ions]

model:
  vsh_over_Csab: 4.6
  vp_over_c: 0.104

targets:
  M_A: 14
  M_ms: 13
  beta_ab: 1150
  beta_0: 0.2
