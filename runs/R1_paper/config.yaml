# R1_paper — the closest reproduction of Schaeffer 2020's Table I run we can build.
#
# Every primary below is the paper's own value, re-read from schaeffer2020.pdf on
# 2026-07-31 (RESULTS entry of that date). It differs from R1_warm in FIVE places,
# each one a correction rather than a tuning choice:
#
#   plasma.piston.theta_e_heat   0.078  -> 0.092    Table I. The 0.078 was an M_A
#                                                   recal compensating the errors below.
#   plasma.piston.density_over_n0 2.5   -> 2.0      Table I: target 2.5 CODE units and
#                                                   n_e,ab = 1.25 code units, so the
#                                                   target is 2.0 n_e,ab. (n_t : n_amb
#                                                   = 250 is unchanged either way.)
#   plasma.ambient.density_over_n0 0.01 -> 0.008    Same reason: Table I's "0.01" is in
#                                                   code units, = 0.008 n_e,ab.
#   plasma.piston.theta_e_init   0.001  -> 0.002    PSC psc_2d_shock.cxx: target_Te = 0.002
#   plasma.piston.theta_i_init  7.8e-4  -> 2.0e-5   PSC target_Ti = 0.002 m_e c^2,
#                                                   ion-normalized. Reverts the warm-ion
#                                                   change -- see the caveat below.
#   geometry.domain_halfwidth_de  7500  -> 9000     Paper: 30000 cells over 9000 d_e,ab,
#                                                   one-sided. Our dz = 0.3 d_e reproduces
#                                                   30000 cells exactly.
#
# WHY THE OLD SETUP WAS WRONG (RESULTS 2026-07-31): with vA_over_c as the primary,
# B0 -- and hence wci0, the clock every t*wci0 plot uses -- scaled as sqrt(n_amb), so
# the 25%-high ambient made the gyroperiod 1.218x short and biased every t*wci0
# observable LATE by that factor. That is the leading candidate for the onset
# t*_1 = 1.35-1.41 vs the paper's ~1 that had been blamed on the half-domain wall.
# B0 is now the primary, so this run's clock is right by construction.
#
# ON THE REDUCED SPEED OF LIGHT: there is nothing to implement. Sec. II of the paper
# defines it as c = sqrt(mu_p/T_e,ab) C_s,ab -- i.e. the reduced c IS theta_e,ab.
# Setting theta_e_heat = 0.092 at mass_ratio = 100 reproduces PSC's c/C_s,ab = 33.0
# exactly, at real c. Table I's "c_sim/c_phys = 0.02" is a reported consequence of
# that choice, not an input (and is rounded; the velocity rows imply 0.0234).
#
# COLLISIONS ARE PSC'S, TRANSLATED (2026-08-01). Read PSC's source: psc_2d_shock.cxx:427
# and psc_flatfoil_yz.cxx:465 both set
#     collision_nu = 3.76 * target_Te_heat^2 / Zi / lambda0
# with `lambda0` a plain free input (30 in the 2d_shock case; Table I's run uses 20).
# That feeds psc_collision_impl.hxx:230 and the Takizuka-Abe kernel in
# binary_collision.hxx:229 -- there is NO Coulomb logarithm, no SI density and no SI
# temperature anywhere in PSC's collision path. Collisionality is a DIAL.
# WarpX's pairwisecoulomb (Perez 2012, UpdateMomentumPerezElastic.H) is the same
# small-angle operator but fully DIMENSIONAL: it builds b0 from real q, eps0, reduced
# mass and relative velocity, so collisionality is an OUTCOME of the SI state and the
# only way in is lnLambda. Inverting PSC's dial therefore gives lnLambda ~ 3e9. That is
# not a hack -- PSC's lambda0 = 20 is equally unphysical at the sim's own (n, T); the
# two codes just expose the same knob differently. Checked safe: sigma/sigma_max = 5e-6
# (WarpX's cross-section clamp never engages) and nu_ei*dt = 3.4e-3 << 1.
#
# WHAT STILL CANNOT MATCH: Table I also quotes lambda_mfp/d_i0 = 350, but lambda_ab = 20
# gives upstream mfp_ii/d_i0 = 0.015. The RATIO of those two is independent of lnLambda
# (both mfps ~ 1/lnLambda) AND of c (both normalizing lengths ~ c), so the 2.3e4x gap
# exists inside PSC too at mu_p = 100 -- it is not a real-c artifact. Sec. II says why:
# global-scale collisionality is "only quantitatively matched at physical mass ratios".
# The 350 row describes the EXPERIMENT, not the run. Criterion 2's 350 threshold is
# therefore not applicable here; lambda_ab = 20 is what PSC actually did.
#
# TWO KNOWN RESIDUAL DEVIATIONS (both unavoidable here, see README.md):
#   - beta rows read 2x Table I: units.py uses beta = 2*mu0*n*T/B^2 while Table I's
#     1150 / 0.2 only reproduce under mu0*n*T/B^2. Convention, not physics.
#   - mass ratio 100 and real c are the paper's own approximations, inherited.

meta:
  run_id: R1_paper
  tier: Full
  description: >
    Faithful reproduction of Schaeffer 2020 Table I: theta_e,ab = 0.092, ambient
    0.008 n_e,ab, target 2.0 n_e,ab, B0 from Table I's own code units, 30000 cells
    over 9000 d_e,ab one-sided, 220 t_ab, and PSC's collisionality lambda_ab = 20
    translated into WarpX's lnLambda. Every Table I dimensionless row reproduces to
    <=2% (beta convention aside); only lambda_mfp/d_i0 cannot match, and it cannot in
    PSC either at mu_p = 100.
  reference: "Schaeffer et al., Phys. Plasmas 27, 042901 (2020), Table I + Sec. II"
  deck: inputs_kinshock_R1_paper

reference:
  n0: 6.0e26                  # [m^-3] = n_e,ab = 6e20 cm^-3, Table I's own SI value.
                              # CORRECTED 2026-08-02 from 1.0e18 (R1_warm's arbitrary
                              # placeholder, 6e8x low and inherited by every other run).
                              # Pure scale factor ONLY if B0_tesla moves with it
                              # (B0 ~ sqrt(n0)) -- both were changed together, so every
                              # dimensionless row is bit-identical to the old setup.
                              # Table I's ambient 4.8e18 cm^-3 / 6e20 = 0.008 exactly,
                              # independently confirming plasma.ambient.density_over_n0.
                              # NB collisions are ON here, so n0 also fixes the deck's
                              # lnLambda (~n0^-1/2) -- see the collisions block.
  mass_ratio: 100.0           # [-] m_i/m_e. Table I
  charge_state: 1             # [-] Table I: Z_ab = Z_0 = 1 (single-species H)

plasma:
  piston:
    density_over_n0: 2.0      # [n0] Table I: target 2.5 code units / n_e,ab 1.25 code units
    theta_e_heat: 0.092       # [kT_e/m_e c^2] Table I: T_e,ab = 0.092 m_e c^2 (47.0 keV at
                              # real c; Table I's 470 eV is its reduced c). THIS IS the reduced c.
    theta_e_init: 0.002       # [kT_e/m_e c^2] PSC psc_2d_shock.cxx:254  g.target_Te = 0.002
    theta_i_init: 2.0e-5      # [kT_i/m_i c^2] ION-normalized, unlike the theta_e rows above.
                              # PSC g.target_Ti = 0.002 m_e c^2, ion-normalized:
                              # 0.002/mass_ratio (u_std = sqrt(theta_i_init)).
                              # NB the SHOCK case injects at 0.002 (= Table I's T_0);
                              # psc_flatfoil_yz.cxx uses 0.001. Shock case wins here.
  ambient:
    density_over_n0: 0.008    # [n0] Table I: n_e0 = 0.01 CODE units = 0.008 n_e,ab.
                              # Confirmed by d_i0/d_i,ab = 11.18 (Table I 11.2) and by
                              # Table I's SI pair 4.8e18 / 6e20 cm^-3 = 0.008 exactly.
    theta_0: 0.002            # [kT/m_e c^2] Table I: T_0 = T_e0 = T_i0 = 0.002 m_e c^2

field:
  orientation: perpendicular  # [-] Table I / Sec. II: B0 = B0 x_hat, theta_B0 = 90 deg
  B0_tesla: 70.27336525536518        # [T]
  # PRIMARY. From Table I's B0 = 0.01 sqrt(m_e c^2), which in PSC's normalization is
  # wce/wpe(n_ref) = 0.01 at the CODE reference density n_ref = n0/1.25:
  #     B0 = 0.01 * m_e * wpe(n0/1.25) / q_e
  # Cross-check: solving M_A = v_sh/v_A = 14 with v_sh = 4.6 C_s,ab gives 70.035 T,
  # agreeing to 0.339% -- two independent Table I rows, one number.
  # v_A is DERIVED: B0/sqrt(mu0*n_amb*m_i) = 0.01 c.
  #
  # TIED TO reference.n0: B0 ~ sqrt(n0), so the two must move together or every
  # dimensionless ratio breaks. Updated 2026-08-02 with n0 1.0e18 -> 6.0e26, i.e.
  # 2.8688981230645468e-3 T * sqrt(6e8) = 24494.897x.
  # This 70.27 T is 10.04x Table I's SI B0 = 7 T, which is the reduced-c factor and
  # NOT an error: the same factor puts T_e,ab at 47.0 keV against Table I's 470 eV,
  # since B ~ c and T ~ c^2 (10.04^2 = 100.8). Inherited with real c, as above.

geometry:
  dims: 1                     # [-] spatial dimensions (1D3V)
  normal_axis: z              # [-] shock normal
  slab_halfwidth_di: 2.0      # [d_i,ab] Sec. II: target occupies 0 < z <= 2 d_i,ab
  domain_halfwidth_de: 9000.0 # [d_e,ab] Sec. II: 9000 d_e,ab, ONE-SIDED (not a centered slab)
  dz_over_de: 0.3             # [d_e,ab] -> 30000 cells, exactly the paper's grid
  layout: one_sided           # [-] see CLAUDE.md: keep foil/injector lo at -slab anyway
  boundary:
    lo: symmetry              # [-] z=0 foil wall
    hi: open                  # [-]

numerics:
  cfl: 0.75                   # [-] -> dt*wpe = 0.225 (paper does not quote its dt)
  particle_shape: 2           # [-] B-spline order
  max_step: 322400            # [steps] = 220 t_ab = 6.49 / wci0, Table I's tau_sim.
                              # (The paper's 400,000 steps is at ITS dt, not ours.)
  ppc:
    piston: 100               # [particles/cell] not quoted by the paper; R1_warm's value
    ambient: 100              # [particles/cell]

operators:
  heater:
    species: piston_electrons # [-]
    intervals: 20             # [steps] PSC flatfoil heating_interval = 20
  injector:
    species: piston_electrons # [-]
    neutralizing_species: piston_ions   # [-]
    intervals: 20             # [steps] PSC flatfoil inject_interval = 20
    tau_over_wpe_inv: 40.0    # [1/wpe] PSC flatfoil inject_tau = 40

collisions:
  model: pairwisecoulomb      # [-] WarpX Perez 2012 operator (fully dimensional)
  pairs: all                  # [-] PSC collides every pair in a cell with one nu_
  target:
    quantity: lambda_ab       # [-] = mfp/d_e,ab (Sec. II). Definition corrected 2026-08-01.
    value: 20.0               # [d_e,ab] Table I. lnLambda is DERIVED from this + n0 and
                              # scales as n0^(-1/2), so the 2026-08-02 density fix moved
                              # it 2.997e9 -> 1.223e5. Still a dial, but 1.1e4x the NRL
                              # physical 10.8 instead of 1.4e8x the old 20.9.
                              # Checked at this density: WarpX's cross-section clamp
                              # (sigma_eff = min(pi b0^2 lnL, sigma_max), sigma_max =
                              # 1/(maxn*rmin)) still never engages -- sigma_eff/sigma_max
                              # = 2.5e-4, a 4.0e3x margin. It grows as n0^(1/6) because
                              # b0 is velocity-set and invariant. nu_ei*dt = 3.4e-3 and
                              # upstream mfp_ii/d_i0 = 0.0150 are both invariant.
  ndt_supercycle: 10          # [steps] PSC collision_interval = 10 (psc_2d_shock.cxx:426)

diagnostics:
  plotfile_intervals: 6448    # [steps] 50 frames over the run (322400/50)
  reduced_intervals: 500      # [steps]
  field_intervals: 250        # [steps]

species:
  piston_electrons: {kind: electron, role: piston}
  piston_ions:      {kind: ion, role: piston, charge_state: 1}
  amb_electrons:    {kind: electron, role: ambient}
  amb_ions:         {kind: ion, role: ambient, charge_state: 1}
ion_species:     [piston_ions, amb_ions]
ambient_ion_species: [amb_ions]

model:
  vsh_over_Csab: 4.6          # [C_s,ab] Table I: v_sh = 4.6 C_s,ab (980 km/s)
  vp_over_c: 0.104            # [c] Table I: v_p = 0.104 c (730 km/s)

targets:
  M_A: 14                     # [-] Table I
  M_ms: 13                    # [-] Table I
  beta_ab: 1150               # [-] Table I (units.py reports 2x; validate() allows it)
  beta_0: 0.2                 # [-] Table I (ditto)
