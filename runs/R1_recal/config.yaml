# R1_recal — FAST coarse-dz confirmation of the theta_e recalibration.
#
# The piston-ion warmth retune (T_i = T_e -> v_th,i = C_s,ab, runs/R1_cal) reproduces
# the paper's broad piston-ion phase space but raised M_A from 14 to ~17 (extra ion
# pressure adds piston push). Since v_sh ~ C_s,ab ~ sqrt(theta_e) (and with T_i=T_e the
# whole warm system scales as sqrt(theta_e)) while v_A is theta_e-independent, M_A ~
# sqrt(theta_e). To pull M_A back to 14:  theta_e = 0.092*(14/17)^2 ~= 0.062.
#
# This run only CONFIRMS that theta_e = 0.062 lands M_A ~ 14 with the warm ions. It is
# run COARSE (dz = 0.6 d_e, ~4x cheaper: half the cells AND half the steps) for a ~12 min
# turnaround; coarse dz over-reads M_A slightly (more grid heating), so M_A ~ 14-16 here
# confirms the fine-dz (0.3) production run (R1_warm) will sit at ~14. theta_i tracks
# theta_e as theta_e/mass_ratio so the piston-ion spread stays at v_th,i = C_s,ab.

meta:
  run_id: R1_recal
  tier: Core
  description: >
    Fast coarse-dz (0.6 d_e) confirmation that theta_e_heat = 0.062 restores M_A ~ 14
    with warm (T_i = T_e) piston ions, before the full-resolution R1_warm production run.
  reference: "Schaeffer et al., Phys. Plasmas 27, 042901 (2020), Table I"
  deck: inputs_kinshock_R1_recal

reference:
  n0: 1.0e18
  mass_ratio: 100.0
  charge_state: 1

plasma:
  piston:
    density_over_n0: 2.5
    theta_e_heat: 0.062       # RECAL (was 0.092): sqrt-scaling target for M_A -> 14 with warm ions
    theta_e_init: 0.001
    theta_i_init: 6.2e-4      # = theta_e_heat/mass_ratio -> T_i = T_e,ab -> v_th,i = C_s,ab (ion-normalized u_std^2)
  ambient:
    density_over_n0: 0.01
    theta_0: 0.002

field:
  orientation: perpendicular
  B0_tesla: 0.0032075256118468715        # PRIMARY [T]. Migrated from vA_over_c = 0.01 (identical B0).
  # v_A is DERIVED: B0/sqrt(mu0*namb*m_i) = 0.01 c

geometry:
  dims: 1
  normal_axis: z
  slab_halfwidth_di: 2.0
  domain_halfwidth_de: 2688.0    # n_cell = 2688/0.6 = 4480 (div by 8); shock ~2100 d_e at t*wci0=1.5
  dz_over_de: 0.6                # COARSE (production uses 0.3) -- calibration turnaround only
  layout: one_sided
  boundary:
    lo: symmetry
    hi: open

numerics:
  cfl: 0.75
  particle_shape: 2
  max_step: 33500                # ~t*wci0 = 1.5 (steps_per_wci0 = 22222 at dz=0.6)
  ppc:
    piston: 100
    ambient: 100

operators:
  heater:
    species: piston_electrons
    intervals: 20
  injector:
    species: piston_electrons
    neutralizing_species: piston_ions
    intervals: 20
    tau_over_wpe_inv: 40.0

diagnostics:
  plotfile_intervals: 750        # ~44 particle frames
  reduced_intervals: 250
  field_intervals: 375

species:
  piston_electrons: {kind: electron, role: piston}
  piston_ions:      {kind: ion, role: piston, charge_state: 1}
  amb_electrons:    {kind: electron, role: ambient}
  amb_ions:         {kind: ion, role: ambient, charge_state: 1}
ion_species:     [piston_ions, amb_ions]
ambient_ion_species: [amb_ions]

model:
  vsh_over_Csab: 4.6
  vp_over_c: 0.104

targets:
  M_A: 14
  M_ms: 13
  beta_ab: 1150
  beta_0: 0.2
