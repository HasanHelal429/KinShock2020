# R3 — NEGATIVE CONTROL: n_e0 = 0 (no ambient plasma / vacuum upstream).
#
# Exact clone of the calibrated production run runs/R1_phase/R1_warm EXCEPT one knob:
#   numerics.ppc.ambient : 100 -> 0
# which loads ZERO ambient macroparticles (amb_electrons + amb_ions) while leaving
# B0 and every derived scale untouched. This is the clean way to isolate the
# ambient's role: B0 = vA*sqrt(mu0*namb*Mi) in units.py still uses the reference
# ambient density (density_over_n0 = 0.01), so vA/wci0/rho_i0/B0/M_A are IDENTICAL
# to R1_warm. (Zeroing amb.density_over_n0 instead would also zero B0 -- conflating
# this control with R2. Zeroing ppc keeps the field, empties the upstream.)
#
# Purpose (REPLICATION_PLAN.md R3, Fig. 9): with no ambient plasma the piston
# expands into vacuum -- no ambient structures, no reflected-ambient-ion beam, no
# shock (nothing to shock). Confirms the R1_warm signatures require the upstream
# medium and are not piston self-compression artifacts.

meta:
  run_id: R3
  tier: Core
  description: >
    Negative control (n_e0 = 0). Clone of R1_warm with numerics.ppc.ambient = 0 so no
    ambient macroparticles load; B0 and all scales stay identical to R1_warm. Confirms no
    ambient structures / reflected-ion beam / shock form without an upstream medium (Fig. 9).
  reference: "Schaeffer et al., Phys. Plasmas 27, 042901 (2020), Fig. 9"
  deck: inputs_kinshock_R3

reference:
  n0: 1.0e18
  mass_ratio: 100.0
  charge_state: 1

plasma:
  piston:
    density_over_n0: 2.5
    theta_e_heat: 0.078       # identical to R1_warm (M_A ~ 14 baseline)
    theta_e_init: 0.001
    theta_i_init: 7.8e-4      # = theta_e_heat/mass_ratio -> T_i = T_e,ab -> v_th,i = C_s,ab
  ambient:
    density_over_n0: 0.01     # kept nonzero ONLY so B0 = vA*sqrt(mu0*namb*Mi) matches R1_warm;
                              # ppc.ambient = 0 below means zero ambient particles actually load.
    theta_0: 0.002

field:
  orientation: perpendicular  # identical to R1_warm (B0 present)
  B0_tesla: 0.0032075256118468715        # PRIMARY [T]. Migrated from vA_over_c = 0.01 (identical B0).
  # v_A is DERIVED: B0/sqrt(mu0*namb*m_i) = 0.01 c

geometry:
  dims: 1
  normal_axis: z
  slab_halfwidth_di: 2.0
  domain_halfwidth_de: 7500.0
  dz_over_de: 0.3
  layout: one_sided
  boundary:
    lo: symmetry
    hi: open

numerics:
  cfl: 0.75
  particle_shape: 2
  max_step: 250000
  ppc:
    piston: 100
    ambient: 0                # NEGATIVE CONTROL: no ambient macroparticles (was 100)

operators:
  heater:
    species: piston_electrons
    intervals: 20
  injector:
    species: piston_electrons
    neutralizing_species: piston_ions
    intervals: 20
    tau_over_wpe_inv: 40.0

diagnostics:
  plotfile_intervals: 5000
  reduced_intervals: 500
  field_intervals: 250

species:
  piston_electrons: {kind: electron, role: piston}
  piston_ions:      {kind: ion, role: piston, charge_state: 1}
  amb_electrons:    {kind: electron, role: ambient}
  amb_ions:         {kind: ion, role: ambient, charge_state: 1}
ion_species:     [piston_ions, amb_ions]
ambient_ion_species: [amb_ions]

model:
  vsh_over_Csab: 4.6
  vp_over_c: 0.104

targets:
  M_A: 14
  M_ms: 13
  beta_ab: 1150
  beta_0: 0.2
