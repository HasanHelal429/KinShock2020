# ws_470eV -- THE COMPARISON: reflecting-wall twin of R1_470eV_s3f8_t2.
#
# The smoke test (ws_smoke_470eV) established that the driver WORKS: measured drift matched
# the request to 0.01%, reflected fraction grew 0 -> 0.17, and density and field ramps
# propagated off the wall together at +11.51 and +11.41 d_i0 per t* (two independent
# measures agreeing to 1%). This run is the actual physics question: with the heater and
# injector replaced by a boundary condition, does the NOTCH still appear?
#
# ---------------------------------------------------------------------------------------
# SIZED AGAINST TWO CONSTRAINTS THE SMOKE TEST REVEALED. Neither is in the original W_phase
# plan, which proposed twinning ss_dz1_ppc100_int1 at 12 d_i0 and t* = 0.6; that would have
# failed both.
#
# (1) THE SLAB IS FINITE AND IT RUNS OUT. There is no injector behind the ambient -- the
#     wall run is a slab drifting into a wall. The shock advances at 11.5 d_i0 per t*
#     (measured) while the upstream drifts in at 13.952 d_i0 per t* (exact:
#     v_sh/(d_i0 w_ci0), and identically 13.952 at BOTH temperatures because v_sh ~ sqrt(T)
#     and w_ci0 ~ B0 ~ sqrt(T) at fixed beta). They close at 25.5 d_i0 per t*, so a box of
#     length L has undisturbed upstream only until t* = L/25.5. At 22 d_i0 that is
#     t* = 0.86, against a target of 0.70 -- 23% margin. The original 12 d_i0 box would have
#     exhausted at t* = 0.47, BEFORE the notch even forms.
#
# (2) RESOLUTION MUST MATCH A NOTCHING RUN, NOT THE CHEAPEST ONE. Onset time is ordered by
#     N_D = ppc*lambda_D/dz -- ss_dz4_ppc400 (N_D 264) onsets at t* ~ 0.44, ss_dz1_ppc400
#     (66) is climbing by 0.28, um1836_470eV (16.5) is notching by 0.15 (RESULTS 2026-09-05).
#     A wall run at low N_D that notched would prove nothing, because noise seeding alone
#     explains it. This run therefore takes R1_470eV_s3f8_t2's grid EXACTLY -- dz_over_de
#     0.0375 (dz/lambda_D = 0.76), ppc 100, N_D = 131.9, filter_npass 8, particle_shape 3 --
#     so the only difference from its piston twin is the driver.
#
# t* = 0.70 covers the notch comfortably: in R1_470eV_s3f8_t2 the drop reaches -71 by
# t* = 0.36 and is saturated at -78 from 0.48 to 0.84. Cost ~6.7 GPU-h (2,783,015 steps at
# 65,589 cells, scaled from that run's measured 0.0135 s/step at 101,984 cells).
#
# READ THE OUTCOME AS: notch present -> it is the plasma, not the heater/injector.
#                      notch absent  -> it is the driver, and the whole 470 eV result is an
#                                       artifact of the most WarpX-specific component here.

meta:
  run_id: ws_470eV
  tier: Physics
  description: >
    Reflecting-wall twin of R1_470eV_s3f8_t2 at 470 eV: no piston species, no heater, no
    injector. Same upstream, same grid, same N_D -- only the driver differs. Asks whether
    the notch survives a change of driver. See runs/W_phase/README.md.
  reference: "Schaeffer et al., Phys. Plasmas 27, 042901 (2020), Sec. I"
  deck: inputs_kinshock_ws_470eV

reference:
  n0: 6.0e26                  # [m^-3] n_e,ab. Identical to R1_paper_470eV.
  mass_ratio: 100.0           # [-] m_i/m_e
  charge_state: 1             # [-]

plasma:
  piston:
    # Retained though no species carries role `piston`: theta_e_heat defines C_s,ab and
    # hence t_ab, the time unit every normalization in this repo is drawn against.
    density_over_n0: 2.0
    theta_e_heat: 9.19767056e-4   # 470 eV
    theta_e_init: 1.95695118e-5   # 10 eV
    theta_i_init: 1.95695118e-7   # 10 eV, ion-normalized
  ambient:
    density_over_n0: 0.008    # [n0] -> n_amb = 4.8e24 m^-3
    theta_0: 1.95695118e-5    # [kT/m_e c^2] = 10 eV -> lambda_D,amb = 1.0730e-8 m

field:
  orientation: perpendicular
  B0_tesla: 7.026446809478    # [T] from beta_ab = 1150, as R1_470eV_s3f8_t2

geometry:
  dims: 1
  normal_axis: z
  slab_halfwidth_di: 0.0        # no target slab: ambient fills the box
  domain_halfwidth_de: 2459.6   # 22.0 d_i0 (d_i0 = 111.80 d_e,ab) -- see constraint (1)
  dz_over_de: 0.037498475            # -> dz/lambda_D,amb = 0.758, as R1_470eV_s3f8_t2
  layout: one_sided
  boundary:
    lo: reflecting              # a RIGID WALL, not a symmetry plane. `symmetry` applies the
                                # pi-rotation about B0 that models a mirror-image half-domain;
                                # here the wall IS the driver and must reflect specularly.
    hi: open

numerics:
  filter_npass: 8             # matched to R1_470eV_s3f8_t2
  cfl: 0.75
  particle_shape: 3           # matched to R1_470eV_s3f8_t2
  max_step: 2783015           # t*w_ci0 = 0.70
  max_grid_size: 65592        # [cells] = n_cell, i.e. ONE box: correct for a single GPU.
  ppc:
    piston: 100
    ambient: 100              # -> N_D = 131.9, as R1_470eV_s3f8_t2

collisions:
  model: pairwisecoulomb
  pairs: all
  target:
    quantity: lambda_ab
    value: 20.0               # -> lnLambda = 12.23 (physical at 470 eV)
  ndt_supercycle: 10

species:
  # No piston species: the wall is the driver. Both ambient species drift toward it at
  # -v_sh so that in the WALL frame the upstream flows in at v_sh.
  # NOTE this is beta, not gamma*beta -- kinshock.deck applies the Lorentz factor itself
  # (u = b/sqrt(1-b^2)) when it writes uz_mean.
  amb_electrons:    {kind: electron, role: ambient, drift_uz_over_c: -0.0139507243}
  amb_ions:         {kind: ion, role: ambient, charge_state: 1, drift_uz_over_c: -0.0139507243}
ion_species:     [amb_ions]
ambient_ion_species: [amb_ions]

targets:
  M_A: 14
  M_ms: 13
  beta_ab: 1150
  beta_0: 0.2

diagnostics:
  plotfile_intervals: 46384   # 60 frames
  field_intervals: 9277       # 300 field-only frames
  reduced_intervals: 4638     # 600 rows

model:
  vsh_over_Csab: 4.6          # [C_s,ab] Table I
  vp_over_c: 0.0103986833     # [c] carried so normalizations resolve identically
