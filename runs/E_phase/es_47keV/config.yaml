# es_47keV -- the eps = v_te,ab/c LADDER, rung 5/5.  T_e,ab = 47012 eV.
#
# WHY THIS RUN EXISTS. The dimensionless audit (RESULTS 2026-08-17) found that R1_paper
# (47 keV) and R1_paper_470eV differ in EXACTLY ONE physics parameter once every Table I
# group is held fixed:
#
#     eps == v_te,ab/c = sqrt(theta_e,ab)      0.3033 (47 keV)  vs  0.03033 (470 eV)
#
# and every group that differs between them is an integer power of it -- v_A/c, v_sh/c,
# C_s,ab/c, lambda_D/d_e all ~ eps^+1; w_pe/w_ce, w_pi/w_ci ~ eps^-1; theta_e,ab, sigma_i,
# sigma_e ~ eps^+2. M_A, M_ms, beta_ab, beta_0, mu, n_0/n_ab, d_i0/d_i,ab, rho_i0/d_i0,
# v_sh/C_s,ab, lambda_ab, nu_ei/w_ce and rho_e,ab/d_e,ab are all PRESERVED. So the
# 470 eV run's thick ambient wedge (2.25 d_i0 against R1_paper's 1.25) is a function of
# eps alone, or it is not physics. This ladder measures that function.
#
# WHAT IS HELD FIXED, AND WHY IT IS dz/lambda_D AND NOT dz/d_e. lambda_D ~ eps while d_e,
# d_i0 and the domain are eps-INDEPENDENT (they depend on n and the real c only). Scanning
# eps at the paper's fixed dz/d_e = 0.3 would therefore drag dz/lambda_D along by the same
# factor of 10 -- reintroducing the exact confound the resolution ladder spent a week
# excluding. This rung instead fixes
#
#     dz/lambda_D,0 = 0.379      ppc = 100      N_D,PIC = ppc*lambda_D/dz = 264
#     domain  = 12.02 d_i0        run  = 0.302/w_ci0
#
# identically to ss_dz16_ppc100, and lets dz/d_e float to 0.18753. Every rung is
# therefore FINER in Debye than R1_paper itself (0.60), so no rung can be dismissed as
# under-resolved, and the discreteness noise level is the same at every rung.
#
# WHAT THIS RUNG MOVES:
#     T_e,ab           47012 eV        (anchor 470)
#     eps             0.3033           (anchor 0.0303)
#     B0              70.273 T          ~ sqrt(T) at fixed beta_ab = 1150
#     w_pe,0/w_ce       10.0          (anchor 100.0, R1_paper 10.0)
#     gamma(T_e,ab)   1.1380           (anchor 1.0014, R1_paper 1.1380)
#     lambda_D,0/d_i0 4.42e-03       (anchor 4.42e-4, R1_paper 4.47e-3)
#
# THE TWO CANDIDATE MECHANISMS MAKE DIFFERENT PREDICTIONS FOR THE SHAPE of wedge(eps),
# which is why the ladder needs interior points and not just the two endpoints:
#   (a) RELATIVISTIC CAPPING of electron heating (~eps^2). gamma is 1.0014, 1.0044,
#       1.0138, 1.0436, 1.1380 across the ladder -- flat until the top rung. Predicts a
#       wedge that stays ~2.25 d_i0 for the lower three rungs and collapses only at 47 keV.
#   (b) ELECTRON-SCALE WAVE REGIME (~eps^-1). rho_e/lambda_D = w_pe/w_ce is 100, 56, 32,
#       18, 10 -- a smooth decade. Predicts a wedge that thins monotonically and roughly
#       log-linearly at every rung.
# A flat-then-drop curve says (a); a straight decade says (b); no trend at all says the
# wedge is not an eps effect and the difference is elsewhere.
#
# COST 0.01 h on one GPU, 7167 cells x 23994 steps at ppc 100. The ladder is
# cheap because cost ~ eps^-3 at fixed dz/lambda_D (cells ~ 1/eps, steps ~ 1/eps^2), so
# every rung above 470 eV is cheaper than the anchor -- all four together are ~1.6 GPU-h
# against the anchor's 7.35.
#
# ONE HONEST CAVEAT: lnLambda. Holding lambda_ab = 20 (Table I) with nu_ei ~ n lnL T^-3/2
# forces lnLambda ~ T^2, so it rides from 12.2 at 470 eV to 1.22e5 at 47 keV -- the same
# unphysical dial R1_paper always carried. It is kept, not removed, because the collisional
# state is what both baselines have and because ss_dz1_ppc100_nocoll already showed that
# deleting collisions entirely does not touch the wedge. nu_ei/w_ce = 1.696 is preserved
# at every rung; nu_ei/w_pe rides ~eps.
#
# ---- inherited header from ss_dz16_ppc100 ----
# ss_dz16_ppc100 -- the resolution ladder taken one step past resolved. dz ALONE.
#
#   dz = 0.01875 d_e  ->  dz/lambda_D,amb = 0.38   (71680 cells, 2.4M steps)
#
# Deliberately NO shape3/filter8: this run isolates dz so the ladder is clean and the
# conjunction test (ss_dz8_ppc100_s3f8) stays interpretable.
#
#     dz1  6.07   dz2  3.04   dz4  1.52   dz8  0.76   dz16  0.38  <- THIS RUN
#
# WHY. dz8 (0.76) visibly cleaned the structure -- striations gone, coherent arc, clean V
# bifurcation -- but left a filled wedge where R1_paper (which sits at dz/lambda_D = 0.60)
# shows a thin single-valued arc. Two readings, and the ladder separates them:
#   (a) the defect switches off at dz ~ lambda_D and dz8's residue is something else --
#       then dz16 looks like dz8 and further refinement buys nothing.
#   (b) suppression is gradual in dz/lambda_D -- then dz16 is visibly cleaner than dz8 and
#       convergence has not been reached even at 0.38.
# Note R1_paper's own 0.60 sits BETWEEN dz8 and dz16, so (a) would also explain why
# R1_paper looks correct while every run here at >= 1.52 does not.
#
# COST 256 cost units, 4x ss_dz8_ppc100. dz8 measured ~2.2 h -> expect ~9 h; 24 h requested
# because every runtime estimate this session has come in optimistic. 28.7M particles.
#
# ---- inherited header from ss_dz8_ppc100 ----
# ss_dz8_ppc100 -- THE FIRST RUN IN THIS PROJECT WITH dz/lambda_D < 1.
#
#   dz = 0.0375 d_e   ->  dz/lambda_D,amb = 0.76   (35840 cells, 1.2M steps)
#
# WHY, 2026-08-13. A HYBRID run at these same parameters reproduces the correct shock
# structure. Hybrid PIC carries no kinetic electrons, so it has no Debye length to resolve
# and no finite-grid instability available to it. That is the one structural difference
# between the code that gets this right and the code that does not.
#
# Every SCHEME knob has already been tried and every one failed -- but all of them at
# dz_over_de = 0.3, i.e. dz/lambda_D,amb = 6.07:
#     h1_filter8            filter_npass 8              negative
#     h2_shape3             particle_shape 3            negative
#     h3_filter8_shape3     both                        negative
#     h4_ppc400             ppc 400                     negative
#     i0_implicit_cfl075    theta_implicit_em           negative
#     i1_explicit_villasenor current_deposition         negative
# and in this session: dz 4x, ppc 16x, collisions off, symmetry wall, Silver-Mueller
# boundary, operator cadence 20->1. All negative, and the phase-space structure (broad
# multi-valued wedge + striations instead of a thin laminar arc) was invariant to all of
# them. That invariance is the tell: a knob that mattered would have moved something.
#
# NO RUN HAS EVER CROSSED dz = lambda_D. The finest ever was dz4 at dz/lambda_D = 1.52 --
# still under-resolved, and "fails later but still fails" is exactly what a finite-grid
# instability does as you approach but do not cross its threshold. The ladder:
#     dz1  0.3000 d_e  ->  6.07      dz4  0.0750 d_e  ->  1.52   (finest so far)
#     dz2  0.1500 d_e  ->  3.04      dz8  0.0375 d_e  ->  0.76   <- THIS RUN
#
# It also explains the c/v_ti dependence exactly: lambda_D/d_e = v_te/c, so undoing the
# reduced-c trick makes dz/lambda_D 10x worse at fixed dz/d_e. R1_paper sits at 0.60 --
# resolved, and it produces the thin laminar arc. This point sits at 6.07 -- not.
#
# WINDOW kept at the standard t*wci0 = 0.3018 (1.2M steps): the broad wedge and the
# striations are already unmistakable by t* = 0.20, so extending to 0.60 would double a
# 3.2 h run to buy nothing for THIS question.
#
# COST 64 cost units, ~3.2 h on one GPU, 14.3M particles. max_grid_size = n_cell = one box.
#
# READ IT AS: if the wedge collapses to a thin laminar arc and the striations vanish, the
# defect is finite-grid heating from an under-resolved electron Debye length, and the true
# cost of this parameter point in explicit PIC is 64x the baseline. If the structure
# survives at dz/lambda_D = 0.76, electron-scale resolution is exonerated too.
#
# ---- inherited header from ss_dz4_ppc100 ----
# ss_dz4_ppc100 -- early-shock-formation resolution sweep, point (dz/4, ppc 100).
#
# READ runs/S_phase/README.md FIRST. It carries the design, the (dz/lambda_D, N_D)
# grid, the domain-truncation control, and how to read the result.
#
# THIS POINT
#   dz/lambda_D,amb = 1.516   (production R1_paper_470eV is 6.066; R1_paper is 0.600)
#   N_D = ppc*lambda_D/dz = 65.9 particles per Debye length   (production is 16.5)
#   dz = 0.075 d_e,ab -> 17920 cells over a 12.021 d_i0 one-sided domain
#   max_step = 600000 = 0.3018/wci0
#   cost = 16 x the ss_dz1_ppc100 point
#
# WHAT THIS RUN IS. R1_paper_470eV's physics EXACTLY -- same piston, heater, injector,
# collisions, B0, densities, temperatures -- on a domain truncated to 12.0 d_i0 and a
# window truncated to t*wci0 = 0.30. That window brackets the anomaly: at t*wci0 = 0.39
# the 470 eV run already has accelerated ambient ions where R1_paper has none
# (RESULTS 2026-08-05, scripts/compare_phase.py), so whatever starts it starts inside
# this window. By t*wci0 = 0.30 the piston has travelled 3.12 d_i0 and the model shock
# 4.19 d_i0, so the domain gives 2.9x head-room ahead of the front.
#
# THE ONE THING TO CHECK BEFORE TRUSTING THIS DOMAIN. `field_hi = open` is pec, which
# REFLECTS fields; only particles are absorbed. Light crosses 12.0 d_i0 in 6000 steps,
# so the piston turn-on precursor makes ~25 round trips inside this window where in the
# full 80.5 d_i0 domain it makes ~4. That is a real difference, and it is why the
# (ss_dz1_ppc100) point is a CONTROL, not just the cheapest sweep point: it must reproduce the
# full R1_paper_470eV run over t*wci0 <= 0.30 before any other point here means
# anything. The full run's diag_fields cadence (2500 steps) gives ~60 frames in that
# window, so the comparison costs no new compute.

meta:
  run_id: es_47keV
  tier: Sweep
  description: >
    eps ladder rung 5/5: T_e,ab = 47012 eV (eps = v_te,ab/c = 0.3033),
    B0 = 70.273 T from beta_ab = 1150. dz/lambda_D,0 = 0.379 and ppc 100 held
    identical to ss_dz16_ppc100, so eps is the only parameter that moves.
    Early-formation resolution sweep point; see runs/S_phase/README.md.
  reference: "Schaeffer et al., Phys. Plasmas 27, 042901 (2020), Table I + Sec. II"
  deck: inputs_kinshock_es_47keV

reference:
  n0: 6.0e26                  # [m^-3] n_e,ab. Identical to R1_paper_470eV.
  mass_ratio: 100.0           # [-] m_i/m_e
  charge_state: 1             # [-]

plasma:
  piston:
    # The piston block is RETAINED even in the piston-free H_phase box, because
    # theta_e_heat defines C_s,ab and hence t_ab -- the time unit this repo's
    # normalizations are drawn against. In H_phase no species carries role
    # `piston`, so none of these values reach a particle.
    density_over_n0: 2.0
    theta_e_heat: 9.200018904e-02   # 47012 eV -- THE LADDER PARAMETER
    theta_e_init: 1.957450828e-03   # 1000.3 eV, T_0/T_e,ab held
    theta_i_init: 1.957450828e-05   # ion-normalized, T_0/T_e,ab held
  ambient:
    density_over_n0: 0.008    # [n0] -> n_amb = 4.8e24 m^-3
    theta_0: 1.957450828e-03    # = 1000.3 eV -> lambda_D,amb = 1.0731e-07 m

field:
  orientation: perpendicular
  B0_tesla: 70.273437465    # [T] from beta_ab = 1150, i.e. ~ sqrt(T_e,ab)

geometry:
  dims: 1
  normal_axis: z
  slab_halfwidth_di: 2.0        # [d_i,ab] Sec. II, unchanged
  domain_halfwidth_de: 1344.0
  dz_over_de: 0.187526162   # [d_e,ab] -> dz/lambda_D,amb = 0.379, HELD
  layout: one_sided
  boundary:
    lo: symmetry
    hi: open

numerics:
  cfl: 0.75
  particle_shape: 2           # [-] baseline. h2_shape3 showed order 3 moves the
                              # grid-scale E_z noise by 1.7% (RESULTS 2026-08-05),
                              # so shape is NOT the lever this sweep is testing.
  max_step: 23994
  max_grid_size: 7167      # [cells] = n_cell, i.e. ONE box: correct for a single
                              # GPU. launch.sh refuses GPU mode without this key.
  ppc:
    piston: 100
    ambient: 100

operators:
  heater:
    species: piston_electrons
    intervals: 20
  injector:
    species: piston_electrons
    neutralizing_species: piston_ions
    intervals: 20
    tau_over_wpe_inv: 400.0   # [1/wpe] as R1_paper_470eV: tau is a PHYSICAL time

collisions:
  model: pairwisecoulomb      # [-] byte-identical to R1_paper_470eV: the resolution
  pairs: all                  # decision has to be made WITH the operator the
  target:                     # production run carries, not against a cleaner
    quantity: lambda_ab       # collisionless surrogate.
    value: 20.0               # -> lnLambda = 12.23 (physical at 470 eV)
  ndt_supercycle: 10

species:
  piston_electrons: {kind: electron, role: piston}
  piston_ions:      {kind: ion, role: piston, charge_state: 1}
  amb_electrons:    {kind: electron, role: ambient}
  amb_ions:         {kind: ion, role: ambient, charge_state: 1}
ion_species:     [piston_ions, amb_ions]
ambient_ion_species: [amb_ions]

targets:
  M_A: 14
  M_ms: 13
  beta_ab: 1150
  beta_0: 0.2

diagnostics:
  plotfile_intervals: 799     # 30 frames (phase space -- the ion
                              # acceleration signature)
  field_intervals: 159       # 150 field-only frames. THE PRIMARY OUTPUT:
                              # E_z and B_perp from the first frames onward.
  reduced_intervals: 79       # 300 rows

model:
  vsh_over_Csab: 4.6          # [C_s,ab] Table I -- carried so t*wci0 / v_sh
  vp_over_c: 0.104000107     # [c] ~ eps; v_p/C_s,ab = 3.4288 is what is held
                              #          R1_paper_470eV.
