# R1 — Schaeffer 2020 representative run (Table I): M_A ~ 14 perpendicular,
# piston-driven, single-species (H) magnetized collisionless shock.
#
# SINGLE SOURCE OF TRUTH for the analysis (see REPLICATION_PLAN.md §6.0a).
# Only PRIMARY quantities live here; everything derived (omega_pe, d_e, d_i,
# omega_ci0, rho_i0, C_s,ab, v_A, B0, M_A, M_ms, beta_ab, beta_0, dt, n_cell, ...)
# is computed by src/kinshock/units.py from these primaries. No physical constant
# is ever hard-coded in the scripts.
#
# Reproduction strategy (plan §1): we reproduce the DIMENSIONLESS run with real c,
# reading every "x c" in Table I as a fraction of the real speed of light. The
# absolute reference density n0 is free (chosen for a convenient dt / domain);
# only ratios matter for the shock physics.

meta:
  run_id: R1_half
  tier: Full                       # Core | Full | Late  (plan §2 domain tiering)
  description: >
    Schaeffer 2020 Table I representative quasi-1D run: strictly perpendicular
    (theta_Bn = 90 deg), single-species H piston + ambient, collisionless.
    M_A ~ 14 supercritical. Primary verification run for the WarpX heater+injector.
  reference: "Schaeffer et al., Phys. Plasmas 27, 042901 (2020), Table I"
  deck: inputs_kinshock_R1_half        # relative to this run dir
  warpx_build: "TBD"                # fill from warpx-cda build (e.g. build/bin/warpx.1d...)
  generated_from: >
    Authored by hand from Table I. After the run, regenerate/verify with
    scripts/make_config.py parsing runs/R1_phase/R1/warpx_used_inputs so the config
    provably matches what was simulated.

# --- fundamental reference (ablation scales) ---
reference:
  n0: 1.0e18            # m^-3, ablation electron density n_e,ab (sets omega_pe, d_e). Free choice.
  mass_ratio: 100.0     # m_i / m_e (Table I)
  charge_state: 1       # Z (single-species H)

# --- plasma populations (densities relative to n0; temperatures as theta = k_B T / m_e c^2) ---
plasma:
  piston:               # the ablated "target" slab (heated + replenished)
    density_over_n0: 2.5      # target density n_t = 2.5 n_e,ab (Table I)
    theta_e_heat: 0.092       # heater target: k_B T_e,ab / m_e c^2 (Table I, 0.092)
    theta_e_init: 0.001       # cold electron load/inject temperature (heater does the heating)
    theta_i_init: 1.0e-5      # cold ion load/inject temperature
  ambient:              # cold, magnetized upstream (not heated / not injected)
    density_over_n0: 0.01     # n_e0 = 0.01 n_e,ab (Table I) -> contrast n_t:n_e0 = 250
    theta_0: 0.002            # upstream temperature k_B T_0 / m_e c^2 (Table I), electrons & ions

# --- background magnetic field (perpendicular, out of the propagation axis) ---
field:
  orientation: perpendicular  # B0 transverse to z (deck sets Bx = B0 in 1D)
  B0_tesla: 0.0032075256118468715        # PRIMARY [T]. Migrated from vA_over_c = 0.01 (identical B0).
  # v_A is DERIVED: B0/sqrt(mu0*namb*m_i) = 0.01 c
  # (was: # PRIMARY: sets B0 = vA * sqrt(mu0 * n_e0 * m_i).)
                              # Chosen so predicted M_A = vsh_model / vA ~ 14 (see model:).
                              # NOTE: with theta_0 = 0.002 this yields beta_0 ~ 0.4 in our
                              # SI formula vs Table I's 0.2 (factor ~2 from the paper's
                              # n_e,ab = 1.25 normalization + reduced c). Same regime:
                              # supercritical, low-beta (beta_0 < 1) perpendicular shock.

# --- geometry (1D3V; z = ablation / propagation axis) ---
geometry:
  dims: 1
  normal_axis: z
  slab_halfwidth_di: 2.0        # target/heater/injector region |z| < 2 d_i,ab (= 20 d_e)
  domain_halfwidth_de: 7500.0   # Full tier (plan §2): shock reaches ~5-6 rho_i0 by t*_3
  dz_over_de: 0.3               # grid resolution (Table I ~0.3 d_e)
  layout: one_sided             # OPTIMIZATION: [0, half] instead of symmetric [-half,+half] (half the cells/particles)
  boundary:
    lo: symmetry                # z=0: pi-rotation-about-B0 wall (validated fix; RESULTS 2026-07-23)
    hi: open                    # far upstream: absorbing particles + pec fields (div-cleaner-safe with B0)

# --- numerics ---
numerics:
  cfl: 0.75
  particle_shape: 2             # raise to 3 if upstream grid heating appears (plan §5)
  max_step: 250000              # ~5.6 omega_ci0^-1 for the Full tier (see units report)
  ppc:
    piston: 100                 # per species in the slab (plan cost basis; paper used 1000)
    ambient: 100                # per species (own loading; independent of piston, plan §5)

# --- laser-ablation surrogate operators (ported PSC model) ---
operators:
  heater:                       # particle_heater.* : Monte-Carlo momentum-space heating
    species: piston_electrons
    intervals: 20               # PSC flatfoil cadence
    # heater theta comes from plasma.piston.theta_e_heat
  injector:                     # target_injector.* : density-relaxation replenishment
    species: piston_electrons
    neutralizing_species: piston_ions
    intervals: 20
    tau_over_wpe_inv: 40.0      # tau = 40 / omega_pe (PSC flatfoil value)

diagnostics:
  plotfile_intervals: 5000       # Full plotfiles (fields + raw particles) -> ~50 frames
  reduced_intervals: 500         # EP/PN reduced diags (energy balance, particle count)
  field_intervals: 250           # field-only diag (E,B,j,rho) -> ~1000 frames, high-
                                 # cadence streaks; ~5.6 GB (vs the much larger particle dump)

# --- species map (names must match the deck and the diagnostics) ---
species:
  piston_electrons: {kind: electron, role: piston}
  piston_ions:      {kind: ion, role: piston, charge_state: 1}
  amb_electrons:    {kind: electron, role: ambient}
  amb_ions:         {kind: ion, role: ambient, charge_state: 1}
ion_species:     [piston_ions, amb_ions]
ambient_ion_species: [amb_ions]     # used for reflected-ion fraction F/G (criterion 6)

# --- model speeds (Table I): used to PREDICT scales pre-run; measured values override post-run ---
model:
  vsh_over_Csab: 4.6      # shock speed (Table I) -> predicted M_A, M_ms
  vp_over_c: 0.104        # piston speed (Table I) -> rho_i0 = vp / omega_ci0

# --- Table I dimensionless targets: validated against derived values (plan §6.0a) ---
targets:
  M_A: 14
  M_ms: 13
  beta_ab: 1150
  beta_0: 0.2
