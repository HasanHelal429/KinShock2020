# ft_15keV_t2 -- false-shock theta ladder (RESULTS 2026-11-16): does the notch appear below the
# paper's theta_e,ab = 0.092 when nothing else changes?
#
# Twin of ek_47keV_t2 (theta_e,ab 0.092, judged clean to t*wci0 = 2.0) with ONLY T_e,ab moved
# to 14.86 keV (theta_e,ab = 0.0290803, eps_ab = 0.1705), every Table I group held exactly as
# the E_phase eps ladder holds them: T_0/T_e,ab, beta_ab (B0 ~ sqrt T), v_p/C_s,ab, dz/lambda_D
# (dz ~ sqrt T), box in d_i0, clock in 1/w_ci0. Numerics are ek_47keV_t2's (dz/lambda_D 0.758,
# shape 3, filter 8, ppc 100), one box on one GPU, one checkpoint at the end (fs_47keV pattern).
# Every judged run is ordered by theta_e,ab: notch at <= 0.037 (PoC), clean only at 0.092 --
# and every long clean run sits at exactly 0.092. This rung tests that ordering.

meta:
  run_id: ft_15keV_t2
  tier: Sweep
  description: >
    False-shock theta ladder: ek_47keV_t2 with only T_e,ab -> 14.86 keV
    (theta_e,ab 0.02908), Table I groups held, to t*wci0 = 2.0.
  reference: "Schaeffer et al., Phys. Plasmas 27, 042901 (2020), Table I + Sec. II"
  deck: inputs_kinshock_ft_15keV_t2

reference:
  n0: 6.0e26                  # [m^-3] n_e,ab. Identical to R1_paper_470eV.
  mass_ratio: 100.0           # [-] m_i/m_e
  charge_state: 1             # [-]

plasma:
  piston:
    # The piston block is RETAINED even in the piston-free H_phase box, because
    # theta_e_heat defines C_s,ab and hence t_ab -- the time unit this repo's
    # normalizations are drawn against. In H_phase no species carries role
    # `piston`, so none of these values reach a particle.
    density_over_n0: 2.0
    theta_e_heat: 2.908029459e-02   # T_e,ab = 14860 eV
    theta_e_init: 6.187296713e-04   # = T_0
    theta_i_init: 6.187296713e-06   # = T_0, ion-normalized
  ambient:
    density_over_n0: 0.008    # [n0] -> n_amb = 4.8e24 m^-3
    theta_0: 6.187296713e-04    # [kT/m_e c^2] = 316.2 eV (T_0/T_e,ab held)

field:
  orientation: perpendicular
  B0_tesla: 39.509018311    # [T] beta_ab = 1150 held (B0 ~ sqrt T)

geometry:
  dims: 1
  normal_axis: z
  slab_halfwidth_di: 2.0        # [d_i,ab] Sec. II, unchanged
  domain_halfwidth_de: 6149.2  # [d_e,ab] = 55.00 d_i0
  dz_over_de: 0.210820077  # [d_e,ab] n_cell 29168: dz/lambda_D,amb = 0.758 held
  layout: one_sided
  boundary:
    lo: symmetry
    hi: open

numerics:
  filter_npass: 8             # [passes] UNDER TEST with dz8
  cfl: 0.75
  particle_shape: 3           # [-] UNDER TEST with dz8 (was 2)
                              # grid-scale E_z noise by 1.7% (RESULTS 2026-08-05),
                              # so shape is NOT the lever this sweep is testing.
  max_step: 251540  # = 2.000/w_ci0
  max_grid_size: 29168  # [cells] = n_cell, ONE box on ONE GPU
                              # GPU. launch.sh refuses GPU mode without this key.
  ppc:
    piston: 100
    ambient: 100

operators:
  heater:
    species: piston_electrons
    intervals: 20
  injector:
    species: piston_electrons
    neutralizing_species: piston_ions
    intervals: 20
    tau_over_wpe_inv: 400.0   # [1/wpe] as R1_paper_470eV: tau is a PHYSICAL time

collisions:
  model: pairwisecoulomb      # [-] byte-identical to R1_paper_470eV: the resolution
  pairs: all                  # decision has to be made WITH the operator the
  target:                     # production run carries, not against a cleaner
    quantity: lambda_ab       # collisionless surrogate.
    value: 20.0               # -> lnLambda = 12.23 (physical at 470 eV)
  ndt_supercycle: 10

species:
  piston_electrons: {kind: electron, role: piston}
  piston_ions:      {kind: ion, role: piston, charge_state: 1}
  amb_electrons:    {kind: electron, role: ambient}
  amb_ions:         {kind: ion, role: ambient, charge_state: 1}
ion_species:     [piston_ions, amb_ions]
ambient_ion_species: [amb_ions]

targets:
  M_A: 14
  M_ms: 13
  beta_ab: 1150
  beta_0: 0.2

diagnostics:
  checkpoint_intervals: 251540  # 1 checkpoints: restartable via perlmutter/submit_chain.sh
  plotfile_intervals: 5030  # 50 particle frames
                              # acceleration signature)
  field_intervals: 838  # 300 field frames
                              # E_z and B_perp from the first frames onward.
  reduced_intervals: 419  # 600 rows

model:
  vsh_over_Csab: 4.6          # [C_s,ab] Table I -- carried so t*wci0 / v_sh
  vp_over_c: 0.058470772     # [c] v_p/C_s,ab held (~ sqrt T)
                              #          R1_paper_470eV.
