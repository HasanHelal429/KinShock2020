# mb_r100_t2 -- mb_r100 run PAST SHOCK FORMATION, for the visual comparison.
#
# WHY. M_phase's five rungs stop at t*w_ci0 = 0.302, which is early formation: the shock
# does not form until t* ~ 1.4 (RESULTS 2026-08-19). The ladder therefore shows the
# ambient wedge but never a formed shock, and the question "is B0 the differentiator"
# was answered from a wedge metric rather than from a picture. This run goes to t* = 2.0
# at the EXTREME rung, w_pe0/w_ce = 100, so it can be put beside `ek_47keV_t2` -- the
# existing t* = 2.0 run at w_pe0/w_ce = 10, same eps, same T_e,ab, same numerics.
# That pair is the two ends of the decade with formed shocks in both.
#
# WHAT IS MATCHED TO ek_47keV_t2, DELIBERATELY, AND WHAT THAT COSTS. dz/lambda_D,0 = 0.758
# (not M_phase's 0.379), particle_shape 3, filter_npass 8. So this run is NOT numerics-
# matched to the five short M_phase rungs. That is the right trade twice over: the
# comparison that matters here is against ek_47keV_t2, and S_phase already established the
# wedge is flat over dz/d_e = 0.019-0.30, a 16x span that contains this 2x change. It is
# also what makes the run affordable -- halving dz/lambda_D halves cells AND steps, which
# exactly pays for going from t* = 1.0 to 2.0 in a 2x box.
#
# BOX. The constraint is the PRECURSOR, not the piston: measured at 24.73 d_i0 per unit t*
# (1.77 v_sh) at rung 1, and since v_sh is frozen across M_phase while w_ci0 ~ B0, that is
# 2.378 rho_i0 per unit t* at EVERY rung. t* = 2.0 needs 4.76 rho_i0; this box is
# 6.00 rho_i0 = 624 d_i0, i.e. ~25% margin. The margin is not decoration:
# that rate was measured at M_A = 14 and beta_0 = 0.2, and this run is M_A = 140,
# beta_0 = 19.6. If the precursor is faster here it will still fill the box, and the run
# is then a null -- check `T_e,upstream` in the far window before reading anything.
#
# WHAT IT TESTS BEYOND THE PICTURE. Whether a shock forms AT ALL at M_A = 140 in a
# thermal-pressure-dominated upstream (beta_0 = 19.6, M_ms saturated at 30.8). RESULTS
# 2026-08-24 records "whether the high-beta_0 rungs are still the same object" as the open
# question behind the v_A/c conclusion. A formed shock here closes it; no shock qualifies
# the whole M_phase result at its high end.
#
#     cells 186,064   steps 795,151   t* = 2.0000   ~5.5 GPU-h predicted
#
# See runs/M_phase/README.md and runs/E_phase/ek_47keV_t2/ for the comparison partner.

meta:
  run_id: mb_r100_t2
  tier: Sweep
  description: >
    mb_r100 carried to t*w_ci0 = 2.0, past shock formation (t*_1 ~ 1.4), on a
    624 d_i0 box sized by the precursor rate. Numerics matched to ek_47keV_t2
    (dz/lambda_D,0 = 0.758, shape 3, filter 8) so the two form a w_pe0/w_ce = 10 vs
    100 pair with formed shocks at fixed eps. Tests whether a shock forms at all at
    M_A = 140, beta_0 = 19.6. See runs/M_phase/README.md.
  reference: "Schaeffer et al., Phys. Plasmas 27, 042901 (2020), Table I + Sec. II"
  deck: inputs_kinshock_mb_r100_t2

reference:
  n0: 6.0e26                  # [m^-3] n_e,ab. Identical to R1_paper_470eV.
  mass_ratio: 100.0           # [-] m_i/m_e
  charge_state: 1             # [-]

plasma:
  piston:
    # The piston block is RETAINED even in the piston-free H_phase box, because
    # theta_e_heat defines C_s,ab and hence t_ab -- the time unit this repo's
    # normalizations are drawn against. In H_phase no species carries role
    # `piston`, so none of these values reach a particle.
    density_over_n0: 2.0
    theta_e_heat: 9.200018904e-02   # 47012 eV -- THE LADDER PARAMETER
    theta_e_init: 1.957450828e-03   # 1000.3 eV, T_0/T_e,ab held
    theta_i_init: 1.957450828e-05   # ion-normalized, T_0/T_e,ab held
  ambient:
    density_over_n0: 0.008    # [n0] -> n_amb = 4.8e24 m^-3
    theta_0: 1.957450828e-03    # = 1000.3 eV -> lambda_D,amb = 1.0731e-07 m

field:
  orientation: perpendicular
  B0_tesla: 7.027343746    # [T] THE SCAN PARAMETER: anchor 70.273437465 / 10.0000

geometry:
  dims: 1
  normal_axis: z
  slab_halfwidth_di: 2.0        # [d_i,ab] Sec. II, unchanged
  domain_halfwidth_de: 69764.8   # [d_e,ab] = 1.156 rho_i0, HELD -- see below
  dz_over_de: 0.37495042   # [d_e,ab] -> dz/lambda_D,0 = 0.758, ek_47keV_t2's value
  layout: one_sided
  boundary:
    lo: symmetry
    hi: open

numerics:
  cfl: 0.75
  filter_npass: 8             # ek_47keV_t2's value, so the pair is matched
  particle_shape: 3           # ek_47keV_t2's value, so the pair is matched
                              # grid-scale E_z noise by 1.7% (RESULTS 2026-08-05),
                              # so shape is NOT the lever this sweep is testing.
  max_step: 795151
  max_grid_size: 186064      # [cells] = n_cell, ONE box: correct for a single GPU
                              # GPU. launch.sh refuses GPU mode without this key.
  ppc:
    piston: 100
    ambient: 100

operators:
  heater:
    species: piston_electrons
    intervals: 20
  injector:
    species: piston_electrons
    neutralizing_species: piston_ions
    intervals: 20
    tau_over_wpe_inv: 400.0   # [1/wpe] as R1_paper_470eV: tau is a PHYSICAL time

collisions:
  model: pairwisecoulomb      # [-] byte-identical to R1_paper_470eV: the resolution
  pairs: all                  # decision has to be made WITH the operator the
  target:                     # production run carries, not against a cleaner
    quantity: lambda_ab       # collisionless surrogate.
    value: 20.0               # -> lnLambda = 12.23 (physical at 470 eV)
  ndt_supercycle: 10

species:
  piston_electrons: {kind: electron, role: piston}
  piston_ions:      {kind: ion, role: piston, charge_state: 1}
  amb_electrons:    {kind: electron, role: ambient}
  amb_ions:         {kind: ion, role: ambient, charge_state: 1}
ion_species:     [piston_ions, amb_ions]
ambient_ion_species: [amb_ions]

targets:
  M_A: 139.5          # per-rung CHECK values, not Table I targets:
  M_ms: 30.8        # this phase deliberately leaves Table I's
  beta_ab: 115000     # M_A = 14 / beta_0 = 0.2 behind.
  beta_0: 19.5745

diagnostics:
  plotfile_intervals: 13253     # 60 frames over t* = 2.0
                              # acceleration signature)
  field_intervals: 1988       # 400 field frames
                              # E_z and B_perp from the first frames onward.
  reduced_intervals: 1325       # 600 rows

model:
  vsh_over_Csab: 4.6          # [C_s,ab] Table I -- carried so t*wci0 / v_sh
  vp_over_c: 0.104000107     # [c] ~ eps; v_p/C_s,ab = 3.4288 is what is held
                              #          R1_paper_470eV.
